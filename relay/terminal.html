<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Card reader</title>
<link rel="icon" href="/design/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/design/tokens.css">
<style>
  /* A store's card reader on a tablet at arm's length: the navy device, then a full-screen answer per swipe. */
  :root {
    --t-screen: var(--ch-navy-2);
    --t-line: var(--ch-navy-line);
    --t-raised: var(--ch-navy-raised);
    --t-picked: #0f3474;     /* the selected store and a hovered key */
    --t-outline: #36528a;    /* preset outlines */
    --t-soft: var(--ch-on-blue-2);
    --t-proof: #bdeaff;      /* proof strings on navy, and the Visa VTC chip on navy */
    --t-on-green-2: #dff1e8;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--ch-navy); color: var(--ch-on-blue);
    font: 400 20px/1.35 var(--ch-font);
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
  }
  body.result-open { overflow: hidden; }
  .reader :focus-visible, #result :focus-visible { outline: 3px dashed var(--ch-on-blue); outline-offset: 3px; }

  /* the device */
  .reader {
    max-width: 820px; margin: 0 auto; padding: 32px 36px 40px;
    display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "brand" "screen" "stores" "pad" "recent";
  }
  .brand { grid-area: brand; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 16px; }
  .brand-name { font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; flex-grow: 1; }
  .brand-net { color: var(--t-soft); }

  .screen {
    grid-area: screen; background: var(--t-screen); border: 1px solid var(--t-line); border-radius: var(--ch-r-panel);
    padding: 24px 28px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .screen .store { font-size: 30px; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
  .screen .meta { font: 500 16px/1.4 var(--ch-mono); color: var(--t-proof); overflow-wrap: anywhere; }
  .screen .amount {
    align-self: flex-end; max-width: 100%; text-align: right; overflow-wrap: anywhere;
    font-size: 92px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }

  .reader button {
    font: inherit; color: inherit; border: 0; border-radius: var(--ch-r-row); margin: 0; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .stores { grid-area: stores; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .stores button {
    min-height: 68px; padding: 8px 18px; border: 1px solid var(--t-line); background: var(--t-raised);
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start; text-align: left; min-width: 0;
  }
  .stores .name { font-size: 20px; line-height: 1.25; font-weight: 600; overflow-wrap: anywhere; }
  .stores .mcc { font: 500 13px/1.35 var(--ch-mono); color: var(--t-soft); }
  .stores button[aria-pressed="true"] { border: 2px solid var(--ch-gold); padding: 7px 17px; background: var(--t-picked); }

  .pad { grid-area: pad; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .presets button {
    min-height: 60px; border: 1px solid var(--t-outline); background: transparent; font-size: 22px; font-weight: 600;
  }
  .keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .keys button {
    min-height: 70px; background: var(--t-raised); font-size: 30px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .keys .word { font-size: 24px; color: var(--t-soft); }
  .keys svg { width: 32px; height: 32px; color: var(--t-soft); }
  .reader .tap {
    min-height: 96px; border-radius: var(--ch-r-card); background: var(--ch-surface); color: var(--ch-navy);
    font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 16px;
  }
  .tap svg { width: 38px; height: 38px; flex: none; }
  .reader .tap:disabled { cursor: progress; background: var(--t-soft); }
  @media (hover: hover) {
    .stores button:hover, .keys button:hover { background: var(--t-picked); }
    .presets button:hover { background: var(--t-raised); }
    .reader .tap:hover:not(:disabled) { background: var(--ch-blue-tint); }
  }
  .reader button:active:not(:disabled) { filter: brightness(1.15); }
  .reader .tap:active:not(:disabled) { filter: none; background: var(--ch-blue-tint); }
  @media (prefers-reduced-motion: no-preference) {
    .reader button:active:not(:disabled) { transform: translateY(1px); }
  }

  /* shown only when there is something to say: a hint in information blue, a failure in the system-failure colours */
  #error:empty { display: none; }
  .msg { font-size: 18px; line-height: 1.45; }
  .msg svg { width: 24px; height: 24px; flex: none; margin-top: 1px; }
  .msg strong { display: block; font-weight: 700; }
  .msg .detail { display: block; font-size: 16px; overflow-wrap: anywhere; }

  .recent { grid-area: recent; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .recent h2 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--t-soft); }
  .recent ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .recent li {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 16px; border-radius: var(--ch-r-row);
    background: var(--t-raised); font-size: 18px;
  }
  .recent li.none { background: transparent; border: 1px dashed var(--t-line); color: var(--t-soft); }
  /* the store and amount keep their line; the badges take what is left, stacking on the right when it is tight */
  .recent .what { flex: 1 0 auto; max-width: 100%; overflow-wrap: anywhere; }
  .recent .tags { flex: 1 1 0; min-width: min-content; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .recent .ch-badge { font-size: 14px; }
  .recent .vtc-chip { background: transparent; border-color: var(--t-proof); color: var(--t-proof); }

  /* the answer: full screen, coloured top (blue protected, green approved, navy while the network is quiet) */
  #result {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain;
    background: var(--ch-navy); color: var(--ch-on-blue); -webkit-user-select: text; user-select: text;
  }
  .r-top { padding: 56px 48px 48px; display: flex; flex-direction: column; gap: 22px; }
  #result.is-declined .r-top { background: var(--ch-blue); }
  #result.is-approved .r-top { background: var(--ch-ok-text); }
  #result.is-pending .r-top { background: var(--ch-navy-raised); }
  .r-where { font: 500 18px/1.4 var(--ch-mono); color: var(--t-soft); text-transform: uppercase; overflow-wrap: anywhere; }
  #result.is-approved .r-where { color: var(--t-on-green-2); }
  #result.is-pending .r-where { color: var(--t-proof); }
  .r-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; }
  .r-word { margin: 0; font-size: clamp(64px, 13vw, 116px); line-height: 0.95; font-weight: 700; letter-spacing: -0.03em; }
  #result.is-pending .r-word { font-size: clamp(34px, 6.4vw, 60px); line-height: 1.1; letter-spacing: -0.01em; }
  .r-amount { font-size: clamp(32px, 5.4vw, 44px); line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; }
  .r-card {
    display: flex; gap: 20px; align-items: flex-start; padding: 24px 26px; border-radius: var(--ch-r-panel);
    background: var(--ch-surface); color: var(--ch-text);
  }
  .r-icon { flex: none; width: 52px; height: 52px; display: grid; place-items: center; color: var(--ch-blue); }
  .r-icon svg { width: 100%; height: 100%; }
  .r-icon.round { border-radius: 50%; }
  .r-icon.round svg { width: 28px; height: 28px; }
  .r-icon.ok { background: var(--ch-ok-bg); color: var(--ch-ok-text); }
  .r-icon.info { background: var(--ch-info-bg); color: var(--ch-info-text); }
  .r-words { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .r-words p { margin: 0; overflow-wrap: anywhere; }
  .r-title { font-size: 26px; line-height: 1.3; font-weight: 600; }
  .r-text, .r-next { font-size: 20px; line-height: 1.5; color: #333333; }
  .r-next { font-weight: 600; color: var(--ch-text); }

  .r-proof { flex: 1 0 auto; padding: 40px 48px 44px; display: flex; flex-direction: column; gap: 22px; }
  .r-overline { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--t-soft); }
  .tiles { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .tile {
    background: var(--ch-navy-raised); border-radius: var(--ch-r-card); padding: 18px 20px; min-width: 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  .tile dt { font-size: 16px; line-height: 1.35; color: var(--t-soft); }
  .tile dd { margin: 0; font-size: 28px; line-height: 1.25; font-weight: 700; overflow-wrap: anywhere; }
  .tile dd.big { font-size: 40px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .tile dd.gold { color: var(--ch-gold); }
  .tile dd.quiet { color: var(--t-soft); font-weight: 600; }
  .r-note { font-size: 18px; line-height: 1.45; }
  .r-note svg { width: 24px; height: 24px; flex: none; margin-top: 1px; }
  .r-note p { margin: 0; }
  .r-told { margin: 0; display: flex; align-items: center; gap: 12px; font-size: 18px; color: var(--t-soft); }
  .r-told svg { width: 22px; height: 22px; flex: none; }
  .r-done {
    margin-top: auto; min-height: 84px; width: 100%; border: 0; border-radius: var(--ch-r-card); cursor: pointer;
    background: var(--ch-surface); color: var(--ch-navy); font: 700 28px/1.2 var(--ch-font);
  }
  .r-done:active { background: var(--ch-blue-tint); }

  @media (prefers-reduced-motion: no-preference) {
    #result:not([hidden]) { animation: r-fade 160ms ease-out; }
    #result:not([hidden]) .r-card { animation: r-card 240ms ease-out; }
  }
  @keyframes r-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes r-card { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: none; } }

  /* tablet landscape: the screen, stores and history on the left, the keypad and Tap card on the right */
  @media (orientation: landscape) and (min-width: 900px) {
    .reader {
      max-width: 1240px; padding: 24px 32px 28px; column-gap: 28px; row-gap: 16px;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: auto auto auto 1fr;
      grid-template-areas: "brand brand" "screen pad" "stores pad" "recent pad";
    }
    .pad { gap: 16px; }
    .screen { padding: 20px 24px; }
    .screen .amount { font-size: 76px; }
    .keys button { min-height: 72px; }
    .recent li { padding: 10px 14px; }

    #result { flex-direction: row; }
    .r-top { flex: 1 1 52%; justify-content: center; padding: 40px; }
    .r-proof { flex: 1 1 48%; justify-content: center; padding: 32px; gap: 18px; }
    .r-done { margin-top: 12px; }
    .r-word { font-size: clamp(56px, 9vw, 104px); }
    #result.is-pending .r-word { font-size: clamp(34px, 4.4vw, 52px); }
    .tiles { gap: 12px; }
    .tile { padding: 16px 18px; }
    .tile dd { font-size: 24px; }
    .tile dd.big { font-size: 30px; }
    .r-done { min-height: 72px; }
  }

  /* phones and narrow windows */
  @media (max-width: 560px) {
    .reader { padding: 16px 16px 28px; gap: 16px; }
    .pad { gap: 16px; }
    .brand { font-size: 14px; }
    .screen { padding: 16px 18px; }
    .screen .store { font-size: 24px; }
    .screen .meta { font-size: 14px; }
    .screen .amount { font-size: clamp(40px, 13vw, 72px); }
    .stores { gap: 10px; }
    .stores button { min-height: 60px; padding: 8px 12px; }
    .stores button[aria-pressed="true"] { padding: 7px 11px; }
    .stores .name { font-size: 17px; }
    .presets { gap: 10px; }
    .presets button { min-height: 52px; font-size: 20px; }
    .keys { gap: 8px; }
    .keys button { min-height: 60px; font-size: 26px; }
    .keys .word { font-size: 20px; }
    .reader .tap { min-height: 80px; font-size: 28px; }
    .recent li { font-size: 16px; padding: 10px 12px; }

    .r-top { padding: 32px 16px 28px; gap: 16px; }
    .r-where { font-size: 15px; }
    .r-card { gap: 14px; padding: 18px; }
    .r-icon { width: 40px; height: 40px; }
    .r-icon.round svg { width: 22px; height: 22px; }
    .r-title { font-size: 22px; }
    .r-text, .r-next { font-size: 17px; }
    .r-proof { padding: 28px 16px 28px; gap: 16px; }
    .tiles { gap: 10px; }
    .tile { padding: 14px; }
    .tile dt { font-size: 14px; }
    .tile dd { font-size: 20px; }
    .tile dd.big { font-size: 24px; }
    .r-note, .r-told { font-size: 16px; }
    .r-done { min-height: 72px; font-size: 24px; }
  }
</style>
</head>
<body>
<main class="reader" id="reader" aria-label="Store card terminal">
  <header class="brand"><span class="brand-name">Card reader</span><span class="brand-net">Visa sandbox · test card</span></header>
  <div class="screen" aria-live="polite">
    <div class="store" id="storeName">Five Points Drug</div>
    <div class="meta" id="storeMeta">MCC 5912 · ATLANTA GA</div>
    <div class="amount" id="amount">$0.00</div>
  </div>

  <div class="stores" id="stores" role="group" aria-label="Store"></div>
  <div class="pad">
    <div class="presets" role="group" aria-label="Preset amounts">
      <button type="button" data-cents="2000">$20</button><button type="button" data-cents="4500">$45</button><button type="button" data-cents="48000">$480</button>
    </div>
    <div class="keys" id="keys" role="group" aria-label="Amount keypad"></div>
    <button type="button" class="tap" id="tap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8.5 8.5a5 5 0 0 1 0 7M12 6a8.5 8.5 0 0 1 0 12M15.5 3.5a12 12 0 0 1 0 17"/></svg>
      <span id="tapLabel">Tap card</span>
    </button>
    <div id="error" role="alert"></div>
  </div>

  <section class="recent" aria-labelledby="recentTitle">
    <h2 id="recentTitle">Last swipes on this reader</h2>
    <ol id="recent"><li class="none">No swipes yet.</li></ol>
  </section>
</main>

<div id="result" role="dialog" aria-modal="true" aria-labelledby="rWord" aria-describedby="rCard" aria-live="assertive" hidden>
  <section class="r-top">
    <div class="r-where" id="rWhere"></div>
    <div class="r-head"><h1 class="r-word" id="rWord"></h1><div class="r-amount" id="rAmount"></div></div>
    <div class="r-card" id="rCard">
      <span class="r-icon" id="rIcon" aria-hidden="true"></span>
      <div class="r-words">
        <p class="r-title" id="rTitle"></p>
        <p class="r-text" id="rText"></p>
        <p class="r-next" id="rNext" hidden></p>
      </div>
    </div>
  </section>
  <section class="r-proof" aria-labelledby="rProofTitle">
    <h2 class="r-overline" id="rProofTitle">What happened on this swipe</h2>
    <dl class="tiles">
      <div class="tile"><dt>Chaperone decided in</dt><dd id="rDecided"></dd></div>
      <div class="tile"><dt>Whole swipe</dt><dd id="rMs"></dd></div>
      <div class="tile"><dt>Visa Transaction Controls</dt><dd id="rVtc"></dd></div>
      <div class="tile"><dt>Card</dt><dd id="rCardNo"></dd></div>
    </dl>
    <div class="ch-banner ch-banner--info r-note" id="rVtcNote" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
      <p id="rVtcNoteText"></p>
    </div>
    <p class="r-told" id="rTold" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4l2-2z"/><path d="M10 21h4"/></svg>
      Priyank's phone was told.
    </p>
    <button type="button" class="r-done" id="rDone">Done</button>
  </section>
</div>

<script>
const STORES = __STORES__;
const $ = (id) => document.getElementById(id);
let store = STORES.find((s) => s.mcc === "5912") || STORES[0];
let cents = 0;
const MAX_CENTS = 1000000;  // relay/host.py MAX_SWIPE_CENTS: the reader takes up to $10,000.00
const VTC_WAIT_MS = 20000;  // after this, a Visa VTC answer that has not come reads "Not available" (it still fills in if it arrives)
const vtcByToken = {};      // Visa VTC's answer per swipe token (vtc_decision)
const decisionByToken = {}; // Chaperone's own record per swipe token (card_decision)
let current = null;         // the swipe on the answer screen
let vtcWaited = false, vtcTimer = null, returnFocus = null;

const money = (c) => "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dollars = (d) => "$" + Number(d || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ms = (n) => `${Number(n).toLocaleString("en-US", { maximumFractionDigits: 1 })} ms`;
const known = (n) => typeof n === "number" && Number.isFinite(n);
const svg = (paths, width = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const ICON = {
  shield: '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 7 12.5V30c0 15 10.5 25 25 31 14.5-6 25-16 25-31V12.5L32 3z" fill="currentColor"/><path d="M20.5 31.5l8 8 15-15" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  key: svg('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>', 2.2),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 2.2),
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', 2.2),
  info: svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>'),
  alert: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.01"/>'),
  back: svg('<path d="M8 5h12v14H8l-5-7 5-7z"/><path d="M12 9l5 6M17 9l-5 6"/>'),
};
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}
// Lithic's result word, or the ledger's approved/declined, as one of three outcomes. No answer is not a decline.
function outcomeOf(result) {
  const word = String(result || "").toUpperCase();
  if (!word || word === "UNKNOWN") return "pending";
  return word === "APPROVED" ? "approved" : "declined";
}

function render() {
  $("storeName").textContent = store ? store.name : "No store set up";
  $("storeMeta").textContent = store ? [`MCC ${store.mcc}`, [store.city, store.state].filter(Boolean).join(" ")].filter(Boolean).join(" · ") : "";
  $("amount").textContent = money(cents);
  for (const b of $("stores").children) b.setAttribute("aria-pressed", String(!!store && b.dataset.id === store.acceptor_id));
}
function amountChanged() {
  if ($("error").dataset.kind === "hint") say();
  render();
}

for (const s of STORES) {
  const b = el("button");
  b.type = "button";
  b.dataset.id = s.acceptor_id;
  b.append(el("span", "name", s.name), el("span", "mcc", `MCC ${s.mcc}`));
  b.onclick = () => { store = s; render(); };
  $("stores").append(b);
}
for (const k of ["1", "2", "3", "4", "5", "6", "7", "8", "9", "C", "0", "DEL"]) {
  const b = el("button");
  b.type = "button";
  if (k === "DEL") { b.innerHTML = ICON.back; b.setAttribute("aria-label", "Delete"); }
  else if (k === "C") { b.textContent = "Clear"; b.className = "word"; }
  else b.textContent = k;
  b.onclick = () => {
    if (k === "C") cents = 0;
    else if (k === "DEL") cents = Math.floor(cents / 10);
    else if (cents < 1000000) cents = cents * 10 + Number(k);
    amountChanged();
  };
  $("keys").append(b);
}
for (const b of document.querySelectorAll(".presets button")) b.onclick = () => { cents = Number(b.dataset.cents); amountChanged(); };

// The line under Tap card: kind "hint" (information) or "fail" (something broke). No arguments clears it.
function say(kind, title, detail) {
  const box = $("error");
  box.replaceChildren();
  delete box.dataset.kind;
  if (!title) return;
  box.dataset.kind = kind;
  const banner = el("div", `ch-banner ${kind === "fail" ? "ch-banner--err" : "ch-banner--info"} msg`);
  banner.innerHTML = kind === "fail" ? ICON.alert : ICON.info;
  const words = el("div");
  words.append(el("strong", "", title));
  if (detail) words.append(el("span", "detail", detail));
  banner.append(words);
  box.append(banner);
  banner.scrollIntoView({ block: "nearest" });
}

async function swipe() {
  if (!store) { say("hint", "No store is set up on this reader."); return; }
  if (!cents) { say("hint", "Enter an amount first."); return; }
  if (cents > MAX_CENTS) { say("hint", `The most this reader takes is ${money(MAX_CENTS)}.`); return; }
  say();
  const amount = cents;
  $("tap").disabled = true;
  $("tap").setAttribute("aria-busy", "true");
  $("tapLabel").textContent = "Processing…";
  const started = performance.now();
  try {
    let r;
    try {
      r = await fetch("/host/api/swipe", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Chaperone-Host": "1" },
        body: JSON.stringify({ acceptor_id: store.acceptor_id, amount_cents: amount }),
      });
    } catch {
      say("fail", "The reader could not reach the card network.", "Check the connection, then tap the card again.");
      return;
    }
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      say("fail", "The swipe did not go through.", typeof body.detail === "string" ? body.detail : `The card network answered ${r.status}.`);
      return;
    }
    show(body, Math.round(performance.now() - started), amount);
  } finally {
    $("tap").disabled = false;
    $("tap").removeAttribute("aria-busy");
    $("tapLabel").textContent = "Tap card";
  }
}
$("tap").onclick = swipe;

// One swipe's answer. r is /host/api/swipe's body; amountCents is what was keyed in for it.
function show(r, roundTrip, amountCents = cents) {
  r = r || {};
  current = {
    token: r.token || null,
    result: r.result,
    reason_key: r.reason_key ?? null,
    reason: r.reason ?? null,
    decided_ms: r.decided_ms,
    ms: r.ms ?? roundTrip ?? r.round_trip_ms,
    store: r.store || (store && store.name) || "",
    mcc: r.mcc || (store && store.mcc) || "",
    card_last4: r.card_last4 || "",
    consumed_pass: r.consumed_pass ?? null,
    amountCents,
  };
  vtcWaited = false;
  clearTimeout(vtcTimer);
  vtcTimer = setTimeout(() => { vtcWaited = true; renderResult(); }, VTC_WAIT_MS);
  renderResult();
  openResult();
}

function renderResult() {
  const c = current;
  if (!c) return;
  // The ledger's card_decision for this token fills in what the swipe's answer lacks, and settles a pending one.
  const seen = (c.token && decisionByToken[c.token]) || {};
  let outcome = outcomeOf(c.result), reasonKey = c.reason_key ?? seen.reason_key ?? null, reason = c.reason ?? seen.reason ?? null;
  if (outcome === "pending" && seen.result) {
    outcome = outcomeOf(seen.result);
    reasonKey = seen.reason_key ?? null;
    reason = seen.reason ?? null;
  }
  const pass = c.consumed_pass || seen.consumed_pass || null;  // Priyank's one-time pass, when the backend reports it
  const last4 = c.card_last4 || seen.card_last4 || "";

  $("result").className = `is-${outcome}`;
  $("rWhere").textContent = [c.store, c.mcc && `MCC ${c.mcc}`].filter(Boolean).join(" · ");
  $("rWord").textContent = { approved: "Approved", declined: "Declined", pending: "Checking with the card network…" }[outcome];
  $("rAmount").textContent = money(c.amountCents);

  let icon = "info", iconClass = "round info", title, text, next = "";
  if (outcome === "approved" && pass) {
    [icon, iconClass, title, text] = ["key", "round ok", "Priyank allowed this once",
      "His one-time pass is now used. The next swipe here follows Ruth's rules again."];
  } else if (outcome === "approved") {
    [icon, iconClass, title, text] = ["check", "round ok", "Chaperone approved this swipe",
      "It checked Ruth's card rules before the store got an answer."];
  } else if (outcome === "declined" && reasonKey) {
    [icon, iconClass, title, text] = ["shield", "", "Chaperone protected Ruth's card", reason || "This swipe is outside Ruth's card rules."];
    next = reasonKey === "card_blocked_category" ? "It stays blocked. Only a change to the rules Ruth and Priyank signed can open it." : "If this is real, Priyank can allow it once from his phone.";
  } else if (outcome === "declined") {
    [title, text] = ["The card was declined", reason || "The card network declined this swipe. Nothing was charged."];
  } else {
    [icon, title, text] = ["clock", "No answer yet",
      "This screen fills in when the answer arrives. If nothing comes, tap Done and try the card again."];
  }
  $("rIcon").className = `r-icon ${iconClass}`;
  $("rIcon").innerHTML = ICON[icon];
  $("rTitle").textContent = title;
  $("rText").textContent = text;
  $("rNext").textContent = next;
  $("rNext").hidden = !next;
  $("rTold").hidden = !(outcome === "declined" && reasonKey);  // Priyank's phone hears every declined card_decision

  const decided = known(c.decided_ms) ? (c.decided_ms < 1 ? "under 1 ms" : ms(c.decided_ms))
    : (outcome === "pending" ? "Waiting" : "Not measured");
  tile("rDecided", decided, known(c.decided_ms) ? "big gold" : "quiet");
  tile("rMs", known(c.ms) ? ms(c.ms) : "Not measured", known(c.ms) ? "big" : "quiet");
  tile("rCardNo", last4 ? `Visa ending ${last4}` : "Ruth's Visa card", "");

  // Visa Transaction Controls answers the same swipe after it, with Ruth's rules mirrored as simpler per-swipe limits.
  const v = c.token ? vtcByToken[c.token] : null;
  let vtc, quiet = false, note = "";
  if (!v) [vtc, quiet] = c.token && !vtcWaited ? ["Checking…", true] : ["Not available", true];
  else if (v.error || typeof v.should_decline !== "boolean") [vtc, quiet] = ["Not available", true];
  else if (v.should_decline) {
    vtc = { declined: "Decline, too", approved: "Would decline", pending: "Decline" }[outcome];
    if (outcome === "approved") note = "Visa Transaction Controls would have declined this: its rule is a simpler per-swipe limit. "
      + (pass ? "Chaperone approved it because Priyank allowed it once." : "Chaperone checked Ruth's full rules and approved it.");
  } else {
    vtc = { declined: "Would approve", approved: "Approve, too", pending: "Approve" }[outcome];
    if (outcome === "declined") note = "Visa Transaction Controls would have let this through: its rule is a simpler per-swipe limit. "
      + "Chaperone checked Ruth's full rules and declined it.";
  }
  tile("rVtc", vtc, quiet ? "quiet" : "");
  $("rVtcNoteText").textContent = note;
  $("rVtcNote").hidden = !note;
}
function tile(id, text, cls) {
  $(id).textContent = text;
  $(id).className = cls;
}

function openResult() {
  const box = $("result");
  if (box.hidden) returnFocus = document.activeElement;
  box.hidden = false;
  $("reader").inert = true;
  document.body.classList.add("result-open");
  box.scrollTop = 0;
  $("rDone").focus({ preventScroll: true });
}
function closeResult() {
  const box = $("result");
  if (box.hidden) return;
  box.hidden = true;
  $("reader").inert = false;
  document.body.classList.remove("result-open");
  clearTimeout(vtcTimer);
  current = null;
  const back = returnFocus && returnFocus.isConnected && returnFocus !== document.body && !returnFocus.disabled ? returnFocus : $("tap");
  back.focus();
}
$("rDone").onclick = closeResult;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("result").hidden) { e.preventDefault(); closeResult(); }
});

const recent = [];
function addRecent(e) {
  const same = e.token ? recent.findIndex((d) => d.token === e.token) : -1;
  if (same >= 0) recent.splice(same, 1);
  recent.unshift(e);
  recent.splice(5);
  drawRecent();
}
function drawRecent() {
  const list = $("recent");
  if (!recent.length) { list.replaceChildren(el("li", "none", "No swipes yet.")); return; }
  list.replaceChildren(...recent.map((d) => {
    const li = el("li");
    const outcome = outcomeOf(d.result);
    const tags = el("span", "tags");
    tags.append(outcome === "approved" ? el("span", "ch-badge ch-badge--ok", d.consumed_pass ? "Approved once" : "Approved")
      : outcome === "declined" ? el("span", "ch-badge ch-badge--protected", "Declined")
      : el("span", "ch-badge ch-badge--info", "Checking"));
    const v = d.token ? vtcByToken[d.token] : null;
    if (v && !v.error && typeof v.should_decline === "boolean") {
      tags.append(el("span", "ch-badge ch-badge--visa vtc-chip", `Visa VTC · ${v.should_decline ? "decline" : "approve"}`));
    }
    li.append(el("span", "what", `${d.store || "A store"} · ${dollars(d.amount)}`), tags);
    return li;
  }));
}

// Card decisions and Visa VTC's answer arrive on the ledger stream (the VTC check runs after the swipe).
const stream = new EventSource("/events/stream?types=card_decision,vtc_decision");
stream.onmessage = (m) => {
  let e; try { e = JSON.parse(m.data); } catch { return; }
  if (e.type === "vtc_decision") {
    if (!e.token) return;
    vtcByToken[e.token] = e;
    drawRecent();
  } else if (e.type === "card_decision") {
    if (e.token) decisionByToken[e.token] = e;
    addRecent(e);
  } else return;
  if (current && e.token && e.token === current.token) renderResult();
};
render();
</script>
</body>
</html>
