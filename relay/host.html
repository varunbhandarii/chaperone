<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Host controls · Chaperone</title>
<link rel="icon" href="/design/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/design/tokens.css">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--ch-ground); color: var(--ch-text); font: 400 15px/1.45 var(--ch-font); }

  .page { min-height: 100vh; max-width: 1440px; margin: 0 auto; padding: 28px 40px 36px; display: flex; flex-direction: column; gap: 22px; }

  /* Header: mark, title, where it lives, what the relay knows about the services */
  .top { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; }
  .top img { width: 30px; height: 30px; flex: none; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; line-height: 1.2; }
  .where { padding: 4px 9px; border-radius: var(--ch-r-badge); background: var(--ch-line); color: #333333; font-size: 14px; font-weight: 600; }
  .services { margin: 0 0 0 auto; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; font-weight: 600; }
  .svc { display: inline-flex; align-items: center; gap: 8px; color: var(--ch-text-2); }
  .svc::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ch-field); flex: none; }
  .svc--ok { color: var(--ch-ok-text); } .svc--ok::before { background: var(--ch-ok); }
  .svc--info { color: var(--ch-info-text); } .svc--info::before { background: var(--ch-info); }
  .svc--err { color: var(--ch-err-text); } .svc--err::before { background: var(--ch-err); }

  /* Two columns on the laptop: steps and the fallback code left, what happened right */
  .layout { flex-grow: 1; display: grid; grid-template-columns: minmax(0, 500fr) minmax(0, 678fr); gap: 22px; }  /* 500 px at 1280 */
  .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .cards { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; }

  .card { min-width: 0; background: var(--ch-surface); border-radius: var(--ch-r-card); padding: 20px 22px; box-shadow: var(--ch-shadow-sm); display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3; }
  .card-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
  .card-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .muted { color: var(--ch-text-2); }
  .empty { margin: 0; font-size: 15px; }

  /* Demo steps */
  .steps { padding: 22px; gap: 12px; }
  .steps .ch-btn { width: 100%; justify-content: space-between; text-align: left; }
  .steps .ch-btn:disabled { cursor: progress; }
  .btn-pay { min-height: 64px; padding: 0 20px; font-size: 20px; }
  .btn-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .btn-row .ch-btn { min-height: 56px; padding: 0 16px; font-size: 17px; }
  kbd { flex: none; padding: 1px 7px; border: 1px solid currentColor; border-radius: 4px; font: 500 13px/1.35 var(--ch-mono); white-space: nowrap; }
  .btn-pay kbd { padding: 2px 8px; border-color: rgb(255 255 255 / 0.5); font-size: 14px; }
  .ch-btn:disabled kbd { border-color: currentColor; }

  /* The fallback code: a person decides, so yellow */
  .code-card { border-radius: var(--ch-r-card); padding: 20px 22px; background: var(--ch-wait-bg); color: var(--ch-wait-strong); display: flex; flex-direction: column; gap: 8px; }
  .code-title { font-size: 15px; font-weight: 700; }
  #code { font: 600 52px/1.15 var(--ch-mono); letter-spacing: 0.12em; color: var(--ch-text); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .code-foot { font-size: 14px; }

  /* Latest order and Priyank's approval */
  .big { font-size: 28px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .big-sub { font-size: 17px; font-weight: 500; color: var(--ch-text-2); }
  .facts { margin: 0; display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 12px; font-size: 15px; }
  .facts dt { color: var(--ch-text-2); }
  .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .mono { font-family: var(--ch-mono); font-size: 14px; overflow-wrap: anywhere; }
  .code-value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 999px; background: var(--ch-raised); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--ch-wait); }
  .card .ch-banner { font-size: 15px; }
  .ch-banner svg { flex: none; }
  .ch-banner b { font-weight: 600; }

  /* Log */
  .log-card { flex-grow: 1; gap: 12px; }
  .say { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--ch-r-row); background: var(--ch-blue-tint); font-size: 16px; line-height: 1.45; overflow-wrap: anywhere; }
  .say svg { flex: none; margin-top: 2px; }
  .say b { font-weight: 600; }
  #log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; font-size: 15px; }
  #log li { display: grid; grid-template-columns: 84px 24px minmax(0, 1fr) minmax(60px, auto); gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--ch-raised); }
  #log li:last-child { border-bottom: 0; }
  #log time { font: 500 14px var(--ch-mono); color: var(--ch-text-2); white-space: nowrap; }
  #log svg { position: relative; top: 2px; }
  #log .ok svg { color: var(--ch-ok); }
  #log .bad svg { color: var(--ch-err-text); }
  #log .what { min-width: 0; overflow-wrap: anywhere; }
  #log .bad .what { color: var(--ch-err-text); }
  #log .ms { font: 500 13px var(--ch-mono); color: var(--ch-text-2); text-align: right; white-space: nowrap; }

  @media (max-width: 1279px) {
    .page { padding: 24px 24px 32px; }
  }
  @media (max-width: 1199px) {
    .layout { flex-grow: 0; align-content: start; grid-template-columns: minmax(0, 1fr); max-width: 880px; width: 100%; margin: 0 auto; }
    .top { max-width: 880px; width: 100%; margin: 0 auto; }
    .log-card { min-height: 240px; }
  }
  @media (max-width: 699px) {
    .page { padding: 16px 16px 28px; gap: 16px; }
    .layout, .col { gap: 16px; }
    .cards { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .card, .steps, .code-card { padding: 16px; }
    h1 { font-size: 24px; }
    .services { margin-left: 0; width: 100%; }
    #code { font-size: clamp(38px, 12vw, 52px); }
    /* each line: icon and words, then the time and the round trip under them */
    #log li { grid-template-columns: 16px minmax(0, 1fr) auto; grid-template-areas: "icon what what" ". time ms"; gap: 2px 10px; }
    #log svg { grid-area: icon; }
    #log .what { grid-area: what; }
    #log time { grid-area: time; font-size: 13px; }
    #log .ms { grid-area: ms; }
  }
  @media (max-width: 479px) {
    .btn-row { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <img src="/design/mark.svg" alt="Chaperone">
    <h1>Host controls</h1>
    <span class="where">Laptop only · never on the wall</span>
    <ul class="services" aria-label="Services">
      <li id="svcRelay" class="svc">Checking the relay</li>
      <li id="svcMerchant" class="svc" hidden></li>
      <li id="svcPay" class="svc" hidden></li>
    </ul>
  </header>

  <main class="layout">
    <div class="col">
      <section class="card steps" aria-labelledby="stepsTitle">
        <h2 id="stepsTitle">Demo steps</h2>
        <button type="button" id="pay" class="ch-btn ch-btn--primary btn-pay" aria-keyshortcuts="P"><span>Confirm payment</span><kbd>P</kbd></button>
        <div class="btn-row">
          <button type="button" id="pickup" class="ch-btn" aria-keyshortcuts="U"><span>Picked up</span><kbd>U</kbd></button>
          <button type="button" id="showCode" class="ch-btn" aria-keyshortcuts="C"><span>Fallback code</span><kbd>C</kbd></button>
          <button type="button" id="replay" class="ch-btn" aria-keyshortcuts="A"><span>Arm replay</span><kbd>A</kbd></button>
          <button type="button" id="reset" class="ch-btn ch-btn--danger" aria-keyshortcuts="Shift+R"><span>Reset demo</span><kbd>Shift R</kbd></button>
        </div>
      </section>

      <section id="codeBox" class="code-card" aria-label="Fallback code" hidden>
        <div class="code-title">Read this to Priyank only if his passkey fails</div>
        <div id="code"></div>
        <div class="code-foot"><span id="codeFor"></span> · hides in <span id="codeLeft">60</span> s</div>
      </section>
    </div>

    <div class="col">
      <div class="cards">
        <section class="card" aria-labelledby="orderTitle">
          <div class="card-head"><h2 id="orderTitle">Latest order</h2><span id="orderBadge" class="ch-badge" hidden></span></div>
          <div id="order" class="card-body"><p class="empty muted">No order yet.</p></div>
        </section>
        <section class="card" aria-labelledby="approvalTitle">
          <div class="card-head"><h2 id="approvalTitle">Priyank's approval</h2><span id="approvalBadge" class="ch-badge" hidden></span></div>
          <div id="approval" class="card-body"><p class="empty muted">No approval asked yet.</p></div>
        </section>
      </div>

      <section class="card log-card" aria-labelledby="logTitle">
        <h2 id="logTitle">Log</h2>
        <div id="say" class="say" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1434CB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5z"/></svg>
          <div><b>Say:</b> <span id="sayText"></span></div>
        </div>
        <p id="logEmpty" class="empty muted">Nothing yet. Actions you take here appear with the time.</p>
        <ul id="log" aria-live="polite"></ul>
      </section>
    </div>
  </main>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const money = (v) => (v === undefined || v === null || v === "") ? "" : "$" + Number(v).toFixed(2);
const words = (v) => String(v ?? "").replace(/_/g, " ").trim();
const upper = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;

const LOG_MAX = 12;
const CODE_SHOW_MS = 60000;
const APPROVAL_WINDOW_S = 90;  // policy gives Priyank 90 s to answer

const ICONS = {
  ok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Done"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bad: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Failed"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
  alert: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#AD2929" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3L12 4z"/><path d="M12 10v4M12 17h.01"/></svg>',
};

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function icon(name) {
  const t = document.createElement("template");
  t.innerHTML = ICONS[name];
  return t.content.firstElementChild;
}

function row(list, label, value, cls = "") {
  const dt = el("dt", "", label);
  const dd = el("dd", cls);
  if (value instanceof Node) dd.append(value); else dd.textContent = value ?? "";
  list.append(dt, dd);
}

function setBadge(badge, text, tone) {
  badge.className = tone ? `ch-badge ch-badge--${tone}` : "ch-badge";
  badge.textContent = text;
  badge.hidden = false;
}

function clock() {
  return new Date().toLocaleTimeString("en-GB", { hourCycle: "h23", hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

// Any `Say: "..."` in a line goes to the callout above the log, where the Host can read it out.
const SAY = /\s*Say:\s*"([^"]+)"\.?/;

function showSay(text) {
  $("sayText").textContent = `\u201c${text}\u201d`;
  $("say").hidden = false;
}

function log(text, ok = true, ms = null) {
  const said = text.match(SAY);
  if (said) {
    text = text.replace(SAY, "").replace(/[\s.]+$/, "");
    showSay(said[1]);
  }
  const li = el("li", ok ? "ok" : "bad");
  const time = el("time", "", clock());
  time.dateTime = new Date().toISOString();
  li.append(time, icon(ok ? "ok" : "bad"), el("span", "what", text), el("span", "ms", ms === null ? "" : `${ms} ms`));
  $("log").prepend(li);
  while ($("log").children.length > LOG_MAX) $("log").lastElementChild.remove();
  $("logEmpty").hidden = true;
}

async function call(method, path) {
  const headers = method === "POST" ? { "X-Chaperone-Host": "1" } : {};
  let r;
  try {
    r = await fetch(path, { method, headers, cache: "no-store" });
  } catch {
    throw new Error("the relay did not answer");
  }
  let body = null;
  try { body = await r.json(); } catch { /* empty */ }
  if (!r.ok) throw new Error((body && body.detail) || `HTTP ${r.status}`);
  return body;
}

// One timing per line: the round trip the Host waited for, measured here.
async function run(button, label, fn) {
  if (button.disabled) return;
  button.disabled = true;
  const started = performance.now();
  const took = () => Math.round(performance.now() - started);
  try {
    const out = await fn();
    const text = typeof out === "string" ? out : out.text;
    log(text, !out.bad, took());
  } catch (err) {
    log(`${label} failed: ${err.message}`, false, took());
  } finally {
    button.disabled = false;
    refresh();
  }
}

// The fallback code: shown for 60 s, or until C hides it
let codeTimer = null, codeTick = null, codeHideAt = 0;

function approvalName(approvalId) {
  const amount = approvalAmounts.get(approvalId);
  return amount !== undefined && amount !== null ? `the ${money(amount)} approval` : `approval ${approvalId}`;
}

function tickCode() {
  $("codeLeft").textContent = String(Math.max(0, Math.ceil((codeHideAt - Date.now()) / 1000)));
}

function showCode(r) {
  const code = String(r.code || "");
  $("code").textContent = code.replace(/^(\d{3})(\d{3})$/, "$1 $2");
  $("code").setAttribute("aria-label", code.split("").join(" "));
  $("codeFor").textContent = upper(`for ${approvalName(r.approval_id)}`);
  codeHideAt = Date.now() + CODE_SHOW_MS;
  $("codeBox").hidden = false;
  clearTimeout(codeTimer);
  clearInterval(codeTick);
  codeTimer = setTimeout(hideCode, CODE_SHOW_MS);
  codeTick = setInterval(tickCode, 1000);
  tickCode();
}

function hideCode() {
  $("codeBox").hidden = true;
  clearTimeout(codeTimer);
  clearInterval(codeTick);
}

const actions = {
  pay: () => run($("pay"), "Confirm payment", async () => {
    const r = await call("POST", "/host/api/confirm-payment");
    const count = (r.order_ids || [r.order_id]).length;
    const how = r.path === "signed webhook" ? "signed notice" : (r.path || "callback");
    return `Confirm payment: ${count === 1 ? "1 order" : `${count} orders`}, ${money(r.amount)}, paid by ${how}. Say: "Marked paid in the sandbox flow."`;
  }),
  pickup: () => run($("pickup"), "Picked up", async () => {
    const r = await call("POST", "/host/api/picked-up");
    const parts = [r.store || "the store", r.pickup_code ? `code ${r.pickup_code}` : ""].filter(Boolean);
    return `Picked up: ${parts.join(", ")}`;
  }),
  reset: () => run($("reset"), "Reset demo", async () => {
    const r = await call("POST", "/host/api/reset");
    hideCode();
    $("say").hidden = true;
    const failed = r.failed || [];
    if (!failed.length) return "Reset demo: policy and merchant clean";
    return { bad: true, text: `Reset demo NOT CLEAN: ${failed.map((name) => `${name} ${r[name]}`).join(", ")}. Fix it and reset again` };
  }),
  replay: () => run($("replay"), "Arm replay", async () => {
    await call("POST", "/host/api/arm-replay");
    return "Arm replay: the station replays on the next press";
  }),
  code: () => run($("showCode"), "Fallback code", async () => {
    if (!$("codeBox").hidden) { hideCode(); return "Fallback code hidden"; }
    const r = await call("GET", "/host/api/approval-code");
    showCode(r);
    return `Fallback code shown for ${approvalName(r.approval_id)}`;
  }),
};

$("pay").onclick = actions.pay;
$("pickup").onclick = actions.pickup;
$("reset").onclick = actions.reset;
$("replay").onclick = actions.replay;
$("showCode").onclick = actions.code;

document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.toLowerCase();
  if (key === "r" && e.shiftKey) actions.reset();
  else if (e.shiftKey) return;
  else if (key === "p") actions.pay();
  else if (key === "u") actions.pickup();
  else if (key === "a") actions.replay();
  else if (key === "c") actions.code();
});

// Plain words for what the merchant and policy report
const ORDER_STATUS = {
  awaiting_payment: ["Awaiting payment", "wait"],
  paid: ["Paid", "ok"],
  preparing: ["Preparing", "ok"],
  ready_for_pickup: ["Ready for pickup", "ok"],
  picked_up: ["Picked up", "ok"],
  cancelled: ["Cancelled", ""],
  partially_refunded: ["Partly refunded", "info"],
  refunded: ["Refunded", "info"],
};
const FULFILMENT = { paid: "not prepared yet", preparing: "preparing", ready_for_pickup: "ready for pickup", picked_up: "picked up" };
const APPROVED_BY = { passkey: "by passkey", code: "by fallback code" };
const NOT_APPROVED = { timeout: "no answer in time", cancelled: "cancelled", passkey: "Priyank said no" };

function paidBy(via) {
  const v = String(via || "");
  if (v.startsWith("cybersource")) return "signed payment notice";
  if (v === "host_confirmed") return "host confirmed";
  if (v.includes("mock")) return "mock page";
  if (v.startsWith("card_auth")) return "card authorization";
  return words(v);
}

function svc(id, tone, text) {
  const item = $(id);
  item.className = tone ? `svc svc--${tone}` : "svc";
  item.textContent = text;
  item.hidden = false;
}

function renderServices(s) {
  if (!s) {
    svc("svcRelay", "err", "Relay not answering");
    $("svcMerchant").hidden = $("svcPay").hidden = true;
    return;
  }
  svc("svcRelay", "ok", "Relay online");
  svc("svcMerchant", s.merchant_error ? "err" : "ok", s.merchant_error ? "Merchant offline" : "Merchant online");
  svc("svcPay", s.webhook_key ? "ok" : "info", s.webhook_key ? "Payment notice: signed webhook" : "Payment notice: callback, no webhook key");
}

function big(amount, sub) {
  const line = el("div", "big");
  if (amount !== undefined && amount !== null && amount !== "") line.append(el("span", "", money(amount)));
  if (sub) line.append(line.childNodes.length ? " " : "", el("span", "big-sub", line.childNodes.length ? sub : upper(sub)));
  return line;
}

function renderOrder(s) {
  const body = $("order"), badge = $("orderBadge");
  body.replaceChildren();
  if (s.merchant_error) {
    badge.hidden = true;
    const banner = el("div", "ch-banner ch-banner--err");
    const text = el("div");
    text.append(el("b", "", "Can't reach the merchant."), " Orders show here when it answers. ", el("span", "mono", s.merchant_error));
    banner.append(icon("alert"), text);
    body.append(banner);
    return;
  }
  if (!s.order) {
    badge.hidden = true;
    body.append(el("p", "empty muted", "No order yet."));
    return;
  }
  const o = s.order;
  const [label, tone] = ORDER_STATUS[o.status] || [upper(words(o.status)) || "Unknown", ""];
  setBadge(badge, label, tone);
  body.append(big(o.amount, o.store));
  const facts = el("dl", "facts");
  if (o.paid_via) row(facts, "Paid by", upper(paidBy(o.paid_via)));
  if (o.pickup_code) {
    const pickup = document.createDocumentFragment();
    pickup.append(el("span", "code-value", String(o.pickup_code)));
    if (o.fulfilment && o.fulfilment !== o.status) pickup.append(` · ${FULFILMENT[o.fulfilment] || words(o.fulfilment)}`);
    row(facts, "Pickup code", pickup);
  }
  row(facts, "Link", o.backend === "visa" ? "Visa Pay by Link, sandbox" : "Mock page");
  row(facts, "Order", o.order_id, "mono");
  if (o.session_id) row(facts, "Session", o.session_id, "mono");
  body.append(facts);
}

const approvalAmounts = new Map();  // approval id -> amount; a result event does not repeat the amount
const approvalLongest = new Map();  // approval id -> most seconds left seen, for the bar

function renderApproval(a) {
  const body = $("approval"), badge = $("approvalBadge");
  body.replaceChildren();
  if (!a) {
    badge.hidden = true;
    body.append(el("p", "empty muted", "No approval asked yet."));
    return;
  }
  if (a.approval_id && a.amount !== undefined && a.amount !== null) approvalAmounts.set(a.approval_id, a.amount);
  const amount = a.amount ?? approvalAmounts.get(a.approval_id);
  if (a.type === "approval_result") {
    if (a.approved) setBadge(badge, "Approved", "ok");
    else setBadge(badge, "Not approved", "");
    const detail = a.approved ? (APPROVED_BY[a.method] || (a.method ? `by ${words(a.method)}` : ""))
                              : (NOT_APPROVED[a.method] || words(a.method));
    body.append(big(amount, detail));
  } else {
    setBadge(badge, "Waiting", "wait");
    const expires = a.expires_at ? Date.parse(a.expires_at) : NaN;
    const left = Number.isNaN(expires) ? null : Math.max(0, Math.round((expires - Date.now()) / 1000));
    body.append(big(amount, left === null ? "" : left > 0 ? `${left} s left` : "time is up"));
    if (left !== null) {
      const longest = Math.max(APPROVAL_WINDOW_S, left, approvalLongest.get(a.approval_id) || 0);
      approvalLongest.set(a.approval_id, longest);
      const bar = el("div", "bar");
      const fill = el("span");
      fill.style.width = `${Math.round((left / longest) * 100)}%`;
      bar.append(fill);
      body.append(bar);
    }
  }
  if (a.approval_id) body.append(el("div", "mono muted", a.approval_id));
}

let refreshAsked = 0, refreshShown = 0;

async function refresh() {
  const mine = ++refreshAsked;
  let s;
  try {
    s = await call("GET", "/host/api/status");
  } catch (err) {
    if (mine > refreshShown) { refreshShown = mine; renderServices(null); }
    return;
  }
  if (mine < refreshShown) return;  // an older answer that arrived late
  refreshShown = mine;
  renderServices(s);
  renderOrder(s);
  renderApproval(s.approval);
}

refresh();
setInterval(refresh, 1000);
</script>
