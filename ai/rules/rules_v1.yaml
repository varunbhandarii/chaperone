      hi:
        - "re:पार्सल में (?:ड्रग्स|ड्रग|नशीले)"
        - "डिजिटल अरेस्ट"
      hi_latn:
        - "re:parcel (?:me|mein) (?:drugs|drug)"
        - "digital arrest"

  R_renewal_callback:
    severity: soft
    hard_with: [deadline]
    pattern: renewal_callback
    spoken_key: refund_scam
    detail: A fake auto-renewal charge with a number to call for a "refund".
    terms:
