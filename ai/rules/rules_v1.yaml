        - "re:(?:disconnect|disconnected|disconnection) (?:my |the |your )?(?:power|electricity|service)"
        - "re:(?:power|electricity|gas|water|service) (?:will be |is being |is going to be |gets )?(?:disconnected|cut off|shut off|turned off)"
