# Chaperone scam rule layer v1. Runs before any model call (policy/rules.py).
#
# Matching: text and terms are both normalized (NFKD, Latin accents and the Devanagari
# nukta stripped, punctuation and danda to spaces, zero-width characters and apostrophes
# deleted, casefolded) and then Hinglish-folded (aa->a, ee->i, oo->u, z->j, w->v, ph->f,
# nahin->nahi) so one spelling covers the variants. Terms match whole words. Prefix a term
# with "re:" for a regex. Backslash escapes (\S) survive the fold; letter ranges such as
# [a-z] do not (z->j), so avoid them.
#
# Languages: en, es, hi (Devanagari) and hi_latn (Hinglish). Grok may write Hindi loanwords
# in either script, so English loanwords also appear under hi.
#
# Decision (per utterance):
#   any hard hit                    -> refuse
#   >= 2 distinct soft rules        -> judge
#   exactly 1 soft rule             -> slow
#   none                            -> proceed
# weak_terms (grandson, nieto, pota, hospital) count only in the utterance's own language and
# only when another soft rule also fires ("my grandson needs it, it's urgent" goes to the judge).
# faint_terms (son, hija, beta) follow the same rules but need another soft rule outside
# faint_needs_other_than ("mi hija viene hoy mismo" stays slow).
# contexts are named word lists. A rule with `needs: [ctx]` fires only when that context is in
# the utterance; `hard_with: [ctx]` makes a soft rule hard when it is. A rule's `spoken_key`
# picks the refusal line (refund_scam beats code_reading beats blocked_category).

version: 1
soft_hits_for_judge: 2
faint_needs_other_than: [R_urgency]

contexts:
  instrument:
    en: ["re:cards?", "gift", "voucher", "recharge", "itunes", "google play", "steam", "bitcoin", "cvv", "cvc", "security code", "re:(?:9|nine|16|sixteen) digit code"]
    es: ["re:tarjetas?", "re:regalo", "recarga", "itunes", "google play", "bitcoin", "cvv", "re:codigo de seguridad"]
    hi: ["कार्ड", "गिफ्ट", "रिचार्ज", "वाउचर", "card", "सीवीवी", "cvv"]
    hi_latn: ["re:cards?", "gift", "recharge", "voucher", "google play", "cvv"]
  refund:
    en: ["re:refund(?:s|ed)?", "re:reimburse(?:d|ment)?", "re:money back", "re:over ?paid", "re:the difference"]
    es: ["re:reembols(?:o|os|aron|ar|e)", "re:devolucion", "re:la diferencia", "re:dinero de vuelta"]
    hi: ["रिफंड", "re:पैसे वापस", "re:(?:फर्क|अंतर)"]
    hi_latn: ["re:refund", "re:paise vapas", "re:fark|difference"]
  fee:
    en: ["re:fees?", "re:charges?", "retainer", "re:deposit", "re:pay(?:ment)? (?:first|upfront|up front)"]
    es: ["re:cargos?", "re:tarifas?", "re:cuotas?", "re:comision(?:es)?", "anticipo", "re:honorarios"]
    hi: ["शुल्क", "फीस", "चार्ज"]
    hi_latn: ["re:fees?", "re:charges?", "shulk"]
  pay:
    en: ["re:links?", "re:click", "re:pay(?:ment)?", "re:card number"]
    es: ["re:enlace", "re:pag(?:ar|ue|o)", "re:haga clic"]
    hi: ["लिंक", "re:भुगतान", "re:पेमेंट"]
    hi_latn: ["re:link", "re:pay kar", "re:payment"]
  # story = a contact cue: someone reached Ruth by call, text, email or pop-up, or a caller is quoted.
  # /screen routes a hard hit to the scam check only with a contact cue AND a money or payment ask
  # (payment_ask, or the ask itself: remote access, reading codes, a safe account, a crypto ATM, a courier).
  # Bare "someone" is not a contact cue: "a gift card for someone at church" stays a plain refusal.
  story:
    en: ["re:(?<!i )(?<!we )(?<!i just )(?<!we just )(?<!i already )(?:called|phoned|texted|messaged|emailed|rang)",
         "re:(?:got|had|received|there was|there is) (?:a |an )?(?:call|phone call|text|message|email|pop ?up|voicemail)",
         "re:(?:the|this|that) (?:call|caller|text|message|email|pop ?up|voicemail)",
         "re:(?:a|the) (?:man|woman|lady|guy|person|officer|agent)(?: from (?:the )?\\w+(?: \\w+){0,2})? (?:on the phone|called|said|says|told|asked|wants)",
         "re:(?:my )?(?:grandson|granddaughter|grandchild|nephew|niece) (?:said|says|told me)",
         "re:(?:called|calling) from", "re:on the (?:phone|line)", "re:pop ?up (?:said|says|told)"]
    es: ["re:(?:me )?(?:llamo|llamaron|escribio|escribieron|mandaron un mensaje)", "re:acaba(?:n)? de (?:llamar|escribir|mandar)",
         "re:(?:mi )?(?:nieto|nieta|hijo|hija|sobrino|sobrina) (?:me )?(?:dice|dijo) que", "re:(?:una|la|esa) (?:llamada|mensaje|correo|ventana)",
         "re:(?:un|el|una|la) (?:senor|senora|hombre|mujer|agente) (?:me )?(?:llamo|dijo|dice|pidio)", "re:por telefono"]
    hi: ["re:(?:फोन|कॉल|मैसेज) (?:आया|आई|किया)", "re:फोन पर", "re:(?:वाले|वाली|आदमी|औरत) ने (?:फोन|कॉल|कहा|बोला)",
         "re:(?:पोते|पोती|नाती|नातिन|बेटे|बेटी) ने (?:फोन|कॉल|कहा|बोला)"]
    hi_latn: ["re:(?:phone|fone|call|message) (?:aaya|aayi|kiya)", "re:(?:phone|fone) (?:pe|par)", "re:(?:vale|vali|aadmi|aurat) ne (?:phone|fone|call|kaha|bola)",
              "re:(?:pote|poti|beta|beti) ne (?:phone|fone|call|kaha|bola)"]
  payment_ask:
    en: ["re:pay(?:s|ing|ment)?", "re:money", "re:dollars?", "re:gift ?cards?", "re:bitcoin|crypto", "re:wire", "re:zelle|venmo|cash ?app", "re:card number", "bail"]
    es: ["re:pag(?:ar|ue|o|a|ues)", "re:dinero", "re:dolares?", "re:tarjetas? (?:de )?regalo", "re:bitcoin|cripto", "re:transferencia", "fianza"]
    hi: ["re:पैसे|पैसा|रुपये", "re:भुगतान", "re:पेमेंट", "re:गिफ्ट ?कार्ड", "re:बिटकॉइन", "re:डॉलर", "re:(?:ज़मानत|जमानत)"]
    hi_latn: ["re:paise|paisa|rupaye", "re:pay kar|payment", "re:gift ?card", "re:bitcoin", "re:dollars?", "re:jamanat"]
  soon:
    en: ["today", "tonight", "re:in (?:an|one|two|\\d+) hours?", "re:within (?:an|one|two|\\d+) hours?", "re:right (?:now|away)", "immediately"]
    es: ["hoy", "re:esta noche", "re:(?:en|dentro de) (?:una|dos|\\d+) horas?", "re:ahora mismo", "re:de inmediato"]
    hi: ["re:आज(?: रात)?", "re:(?:एक|दो|\\d+) घंटे", "re:अभी", "तुरंत"]
    hi_latn: ["re:aaj(?: raat)?", "re:(?:ek|do|\\d+) ghante", "turant"]
  grandchild:
    en: ["re:grand(?:son|daughter|child|kid)s?"]
    es: ["re:niet[oa]s?"]
    hi: ["re:पोत(?:ा|ी|े)", "re:नात(?:ी|िन)"]
    hi_latn: ["re:pot(?:a|i|e)", "re:nati(?:n)?"]
  money_ask:
    en: ["re:\\d+ dollars", "re:(?:hundred|thousand) dollars", "money", "cash", "bail", "re:gift ?cards?", "re:wire"]
    es: ["re:\\d+ dolares", "dinero", "efectivo", "fianza", "re:tarjetas? de regalo"]
    hi: ["re:पैसे|पैसा", "re:(?:ज़मानत|जमानत)", "re:डॉलर", "कैश"]
    hi_latn: ["re:paise|paisa", "re:jamanat", "dollar", "cash"]
  deadline:
    en: ["re:within (?:24|48|twenty four|forty eight) hours", "re:(?:by|before) (?:today|tonight|midnight|the end of (?:the )?day)", "re:call (?:us |them |back )?(?:now|immediately|right away)"]
    es: ["re:(?:en|dentro de) (?:24|48|veinticuatro) horas", "hoy mismo", "re:llame (?:ahora|de inmediato)"]
    hi: ["re:24 घंटे", "आज ही", "re:तुरंत (?:कॉल|फोन)"]
    hi_latn: ["re:24 ghante", "aaj hi", "re:turant (?:call|fone)"]

rules:
  R1_blocked_category:
    severity: hard
    pattern: blocked_category
    detail: Gift cards, prepaid cards, wire transfers, crypto and money orders are never purchasable.
    terms:
      en:
        - "re:gift ?cards?"
        - "re:(?:prepaid|reloadable|recharge) (?:\\S+ )?(?:debit )?cards?"
        - "re:(?:google ?play|play store|itunes|steam|razer gold) (?:gift )?cards?"
        - "re:(?<!my )(?:apple|amazon|target|walmart|ebay|google ?play|itunes|steam) cards"
        - "re:(?:hundred|thousand|\\d{3,}) dollars? (?:worth )?(?:of|in) (?:\\S+ )?cards?"
        - "re:(?:google ?play|play store|itunes|steam) (?:recharge|balance|credit|codes?|vouchers?|wallet)"
        - "re:(?:buy|get|purchase|send) (?:\\S+ )?(?:itunes|google ?play|razer gold)"
        - "re:visa gift cards?"
        - "re:prepaid visa"
        - "re:vanilla (?:visa|gift)"
        - "re:wire (?:transfer|the money|money)"
        - "western union"
        - "moneygram"
        - "re:money ?orders?"
        - "re:bitcoins?"
        - "re:crypto(?:currency|currencies)?"
        - "re:(?:bitcoin|crypto) atm"
      es:
        - "re:tarjetas? (?:de )?regalo"
        - "re:tarjetas? (?:de )?(?:google ?play|play store|itunes|steam)"
        - "re:(?:\\S*cient[oa]s|quinient[oa]s|cien|ciento|mil|\\d{3,}) dolares (?:en|de) (?:\\S+ )?tarjetas"
        - "re:tarjetas? (?:prepagadas?|prepago|de recarga|recargables?)"
        - "re:tarjetas? telefonicas?"
        - "re:transferencias? (?:bancarias?|de dinero)"
        - "re:giros? (?:postal|postales|de dinero)"
        - "re:ordenes? de pago"
        - "re:bitcoins?"
        - "re:criptomonedas?"
        - "cripto"
        - "western union"
        - "moneygram"
      hi:
        - "re:(?:गिफ्ट|gift) ?(?:कार्ड|card)(?:्स|स|s)?"
        - "re:उपहार (?:कार्ड|card)(?:्स|स)?"
        - "re:(?:गूगल प्ले|प्ले स्टोर|आईट्यून्स|स्टीम|google ?play|itunes) (?:(?:का|के|की) )?(?:गिफ्ट )?(?:कार्ड|card)(?:्स|स|s)?"
        - "re:(?:सौ|हज़ार|हजार|sau|hajar|\\d{3,}) (?:डॉलर|dollar) (?:का|के|की|ka|ke|ki) (?:\\S+ )?(?:कार्ड|cards?)"
        - "re:(?:गूगल प्ले|google ?play) (?:रिचार्ज|recharge)"
        - "प्रीपेड कार्ड"
        - "रिचार्ज कार्ड"
        - "बिटकॉइन"
        - "बिटकोइन"
        - "क्रिप्टो"
        - "वायर ट्रांसफर"
        - "मनी ऑर्डर"
        - "वेस्टर्न यूनियन"
      hi_latn:
        - "re:gift ?cards?"
        - "re:tohfa cards?"
        - "re:(?:google ?play|play store|itunes|steam) (?:(?:ka|ke|ki) )?(?:gift )?cards?"
        - "re:(?:sau|hajar|\\d{3,}) dollar (?:ka|ke|ki) (?:\\S+ )?cards?"
        - "re:(?:google ?play|play store|itunes|steam) (?:recharge|balance|codes?|voucher|wallet)"
        - "re:(?:prepaid|recharge) cards?"
        - "re:bitcoins?"
        - "crypto"
        - "wire transfer"
        - "money order"
        - "western union"

  R_code_reading:
    severity: soft
    hard_with: [instrument, refund]
    pattern: code_reading
    detail: Someone wants card numbers, codes, a PIN or an OTP read out to them.
    terms:
      en:
        - "re:read (?:him|her|them|out) (?:the )?(?:numbers?|codes?|pin|otp)"
        - "re:read (?:me )?(?:the )?(?:numbers?|codes?|pin) (?:on|from|off) (?:the )?(?:back|cards?|gift cards?)"
        - "re:(?:numbers?|codes?) on the back of (?:the|that|this|those|these|each) (?:gift )?cards?"
        - "re:(?:give|tell|send) (?:him|her|them|the man|the caller) (?:the )?(?:numbers?|codes?|pin|otp)"
        - "re:scratch (?:off )?(?:the )?(?:back|silver)"
        - "upi pin"
        - "re:(?:read|give|tell|say|send) (?:me |him |her |them |us )?(?:the |your |my )?(?:cvv|cvc|security code)"
        - "re:(?:9|nine|16|sixteen) digit code"
      es:
        - "re:(?:leame|leale|leerle|leer|dicteme|dictele|dictarle) (?:los|el) (?:numeros?|codigos?)"
        - "re:(?:dele|darle|deme|mandele|mandarle) (?:los|el) (?:numeros?|codigos?|pin)"
        - "re:(?:el )?codigo de (?:la )?tarjeta"
        - "re:raspe? (?:la parte de )?atras"
        - "re:raspar (?:la parte de )?atras"
        - "re:(?:digame|dime|deme|dele|digale) (?:el )?(?:codigo(?! de recogida| del pedido)|cvv)"
      hi:
        - "re:(?<!पिकअप )(?<!ऑर्डर )(?:ओटीपी|otp|कोड|नंबर|पिन) (?:बताओ|बताइए|बताना|बता दो|बता दीजिए|बता देना|बताएं|बोलो|बोलिए|बोल दो|बोल दीजिए|भेजो|भेज दो|शेयर करो|शेयर कर दो|पढ़ो|पढो|पढ़कर)"
        - "re:(?:ओटीपी|otp|पिन) (?:दे दो|दीजिए)"
        - "पीछे का नंबर"
        - "यूपीआई पिन"
        - "re:(?:सीवीवी|cvv) (?:बताओ|बताइए|बता दो|बोलो|बोल दो|दे दो)"
      hi_latn:
        - "re:(?<!pickup )(?<!order )(?:otp|code|number|pin) (?:batao|bataiye|batana|bata do|bata dijiye|bata dena|bolo|boliye|bol do|bhejo|bhej do|padho|padh kar|share karo|share kar do)"
        - "re:(?:otp|pin) (?:de do|dijiye)"
        - "re:(?:piche|pichhe|peeche|peechhe|pichey) (?:ka|ke|ki) (?:number|numbar|code)"
        - "re:cvv (?:batao|bata do|bolo|bol do|de do)"
        - "upi pin"

  R_family_emergency:
    severity: soft
    pattern: family_emergency
    detail: A relative in trouble is the most common coached-purchase story.
    terms:
      en:
        - "re:in (?:jail|prison)"
        - "arrested"
        - "re:(?:car )?accident"
        - "re:in (?:big |bad )?trouble"
        - "lawyer"
        - "re:(?:was|got|been) (?:hurt|detained|kidnapped)"
      es:
        - "re:(?:en|a) la carcel"
        - "re:arrestad[oa]"
        - "re:detenid[oa]"
        - "re:accidente"
        - "re:en problemas"
        - "abogado"
      hi:
        - "जेल"
        - "गिरफ्तार"
        - "दुर्घटना"
        - "एक्सीडेंट"
        - "मुसीबत"
        - "वकील"
        - "re:हादसा|हादसे"
      hi_latn:
