        - "re:giraftar"
        - "accident"
        - "musibat"
        - "vakil"
        - "re:hadsa|hadse"
    weak_terms:
      en: ["re:grand(?:son|daughter|child|kid)s?", "hospital"]
      es: ["re:niet[oa]s?", "hospital"]
      hi: ["re:पोत(?:ा|ी|े)", "re:नात(?:ी|िन)", "अस्पताल"]
      hi_latn: ["re:pot(?:a|i|e)", "re:nati(?:n)?", "hospital"]
    faint_terms:
      en: ["son", "daughter", "nephew", "niece"]
      es: ["re:hij[oa]s?", "re:sobrin[oa]s?"]
      hi: ["बेटा", "बेटी"]
      hi_latn: ["beta", "beti"]

  R_purpose:
    severity: soft
    pattern: purpose
    detail: The money is for bail, a fine, taxes, an unlock, customs or a parcel (refund scams have their own rules).
    terms:
      en:
        - "bail"
        - "re:(?:pay|owe|a|the) fines?"
        - "re:(?:back |unpaid )?taxes"
        - "re:owe (?:the )?(?:irs|tax)"
        - "re:unlock (?:my |the )?(?:account|computer)"
        - "customs"
