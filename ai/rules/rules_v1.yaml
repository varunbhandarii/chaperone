  R_silence_request:
    severity: hard
    pattern: silence_request
    spoken_key: refund_scam
    detail: Told not to tell the bank or the police.
    terms:
      en:
        - "re:(?:dont|do not|never) (?:tell|call|contact|inform) (?:your |the |my )?(?:bank|police|cops|fraud department|branch)"
