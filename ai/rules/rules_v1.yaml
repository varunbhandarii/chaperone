      hi:
        - "re:कस्टम (?:क्लियरेंस )?(?:चार्ज|शुल्क|फीस)"
        - "re:कस्टम में (?:अटका|फंसा|रुका)"
      hi_latn:
        - "re:customs (?:me|mein) (?:atka|fansa|ruka)"
        - "re:customs (?:clearance )?(?:charge|fee)"

  R_redelivery_fee:
    severity: soft
    hard_with: [pay]
    pattern: redelivery_fee
    spoken_key: refund_scam
    detail: A "redelivery fee" text; with a link or payment it is the top text scam.
    terms:
      en:
        - "re:redelivery (?:fee|charge)"
        - "re:(?:unpaid|insufficient) postage"
        - "re:(?:failed|missed) delivery (?:attempt|fee)"
