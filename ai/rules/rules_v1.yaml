    pattern: third_party_instruction
    detail: Someone else is directing the purchase, often on the phone or a pop-up.
    terms:
      en:
        - "re:(?:he|she|they|the man|the woman|the caller|the officer|the agent) (?:told|said|asked) (?:me )?to"
        - "re:(?:hes|shes|theyre|they are|he is|she is) (?:still )?on the (?:phone|line)"
        - "re:(?:pop ?up|popup) (?:said|says|told)"
        - "re:(?:ship|send) (?:it|them) to (?:a|his|her|their) (?:new|different) address"
      es:
        - "re:me (?:dijo|dijeron|pidio|pidieron) (?:por telefono )?que"
        - "re:(?:el|la) (?:senor|senora|hombre|mujer) (?:del|en el) telefono"
        - "re:(?:esta|sigue) en la linea"
        - "ventana emergente"
        - "re:(?:mandarlo|enviarlo|mandarlos|enviarlos) a (?:otra|una nueva) direccion"
      hi:
        - "re:(?:उसने|उन्होंने|उन्होने) (?:कहा|बोला)"
        - "re:(?:फोन|कॉल) पर (?:कहा|बोला|बताया)"
        - "re:(?:नए|दूसरे) पते पर"
      hi_latn:
        - "re:(?:usne|unhone|unhonne) (?:kaha|bola)"
        - "re:(?:fone|phone|call) (?:pe|par) (?:kaha|bola|bataya)"
        - "re:(?:naye|dusre) pate (?:pe|par)"

  # ------------------------------------------------------------------ refund, recovery, delivery
  # The same guardrails in reverse: scams that start after a purchase. Hard forms refuse with
  # the refund_scam line and alert Priyank.

  R_overpay_sendback:
    severity: hard
    pattern: refund_overpay
    spoken_key: refund_scam
    detail: '"We refunded you too much, send back the difference" is always a scam.'
    terms:
      en:
        - "re:refunded (?:you |me )?(?:too much|extra|by mistake)"
        - "re:(?:over ?refund(?:ed)?|over ?paid you|overpayment)"
        - "re:(?:put|added|deposited|sent) (?:too much|extra) (?:money )?(?:in|into|to) (?:my|your) account"
      es:
        - "re:(?:me|le|te|nos) reembolsaron de mas"
        - "re:reembolso de mas"
        - "re:depositaron de mas"
        - "re:(?<!me )(?:manda|mande|envia|envie) la diferencia"
      hi:
        - "re:(?:ज़्यादा|ज्यादा) रिफंड"
      hi_latn:
        - "re:(?:zyada|jyada|jada) refund"

  R_difference_back:
    severity: soft
    needs: [refund]
    pattern: refund_overpay
    spoken_key: refund_scam
    detail: '"Send back the difference" is the overpayment scam, and also how an honest overcharge sounds.'
    terms:
      en:
        - "re:send (?:back )?the (?:difference|extra)"
        - "re:(?:return|pay) (?:back )?the (?:extra|difference)"
      es:
        - "re:devuelv[ae] la diferencia"
        - "re:devolver la diferencia"
      hi:
        - "re:(?:ज़्यादा|ज्यादा) पैसे"
        - "re:(?:फर्क|अंतर) वापस"
      hi_latn:
        - "re:(?:zyada|jyada|jada) paise"
        - "re:(?:fark|difference) vapas"

  R_fee_for_refund:
    severity: hard
    pattern: refund_fee
    spoken_key: refund_scam
    detail: A fee to release a refund; real refunds never cost money.
    terms:
      en:
        - "re:(?:processing|release|handling|service) fee (?:to|for) (?:release |get |process |receive )?(?:your |my |the )?refund"
        - "re:(?:pay|send) (?:a |the )?(?:fee|retainer|charge) (?:to|for|before) (?:\\S+ )?(?:refund|recover\\S*)"
        - "re:refund processing (?:fee|charge)"
      es:
        - "re:cargo de procesamiento"
        - "re:anticipo de honorarios"
        - "re:(?:pagar|pague) (?:un |una |el |la )?(?:cargo|tarifa|cuota|comision) (?:para|por) (?:el |su |mi )?reembolso"
      hi:
        - "re:रिफंड के लिए (?:शुल्क|फीस|चार्ज)"
        - "re:रिफंड (?:शुल्क|फीस)"
      hi_latn:
        - "re:refund ke liye (?:processing )?(?:fee|fees|charge|shulk)"
        - "re:refund (?:fee|charge)"

  R_recovery_for_fee:
    severity: soft
    hard_with: [fee]
    pattern: recovery_fee
    spoken_key: refund_scam
    detail: '"We can recover your lost money"; with a fee it is a recovery scam.'
    terms:
      en:
        - "re:recover (?:your|my|the) (?:lost )?(?:money|funds|savings)"
        - "re:recovery (?:service|agency|firm|company|team)"
        - "re:get (?:your|my) lost money back"
      es:
        - "re:recuperar (?:su|mi|el) dinero"
        - "re:recuperacion de (?:dinero|fondos)"
      hi:
        - "re:पैसा वापस (?:दिला|दिलवा)"
        - "re:पैसे रिकवर"
      hi_latn:
        - "re:(?:paisa|paise) recover"
        - "re:paisa vapas dila"

  R_remote_access:
    severity: hard
    pattern: remote_access
    spoken_key: refund_scam
    detail: Remote-access apps and screen sharing hand a stranger the computer.
    terms:
      en:
        - "re:any ?desk"
        - "re:team ?viewer"
        - "re:share (?:your|my) screen"
        - "re:screen ?shar(?:e|ing)"
        - "re:remote (?:access|desktop)"
        - "re:(?:ultra ?viewer|rust ?desk|log ?me ?in|splash ?top|quick ?support|zoho assist|supremo)"
        - "re:(?:give|let) (?:him|her|them) (?:control|access) (?:of|to) (?:my|the) (?:computer|pc|laptop|phone|screen)"
      es:
        - "re:acceso remoto"
        - "re:compartir (?:su |mi |la )?pantalla"
        - "re:(?:ultra ?viewer|rust ?desk|quick ?support)"
        - "re:any ?desk"
        - "re:team ?viewer"
      hi:
        - "re:स्क्रीन शेयर"
        - "एनीडेस्क"
      hi_latn:
        - "re:any ?desk"
        - "re:screen share"

  R_refund_rail:
    severity: hard
    needs: [refund]
    pattern: refund_rail
    spoken_key: refund_scam
    detail: A refund paid out or sent back through gift cards, wires, crypto, cash, Zelle or UPI.
    terms:
      en:
        - "re:gift ?cards?"
        - "re:wire"
        - "re:bitcoin|crypto"
        - "re:(?:send|mail|withdraw) (?:\\S+ )?cash"
        - "zelle"
        - "re:venmo|cash ?app|paypal"
      es:
        - "re:tarjetas? (?:de )?regalo"
        - "re:(?:mande|mandar|envie|enviar|retire|retirar|saque|sacar) (?:\\S+ )?efectivo"
        - "zelle"
        - "re:transferencia"
      hi:
        - "re:(?:गिफ्ट|gift) ?(?:कार्ड|card)"
        - "re:(?:नकद|कैश) (?:भेजो|भेजिए|भेज दो|निकालो|निकालिए|निकाल कर)"
      hi_latn:
        - "re:gift ?cards?"
        - "re:(?:upi|paytm) (?:se |pe |par )?(?:bhejo|bhej do|transfer karo|transfer kar do)"
        - "re:upi id (?:pe |par |me |mein )?(?:bhej|dal)\\S*"
        - "re:cash (?:bhejo|do|de do)"

  R_customs_hold:
    severity: hard
    pattern: customs_hold
    spoken_key: refund_scam
    detail: A parcel "held in customs" until a fee is paid.
    terms:
      en:
        - "re:(?:held|stuck|detained|seized) (?:in|at|by) customs"
        - "re:customs (?:clearance )?(?:fee|charge|duty)"
        - "re:clearance (?:fee|charge)"
        - "re:pay (?:the |a )?(?:tariff|customs duty|import duty)"
      es:
