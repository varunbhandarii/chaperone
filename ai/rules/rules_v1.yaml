        - "re:delivery fail (?:ho gayi|hui)"

  R_parcel_illegal:
    severity: hard
    pattern: parcel_illegal
    spoken_key: refund_scam
    detail: '"Your parcel has drugs" or "digital arrest": an impersonation shakedown.'
    terms:
      en:
        - "re:(?:package|parcel|box) (?:has|had|contains|contained|with) (?:illegal )?(?:drugs|narcotics|weapons|contraband)"
        - "re:(?:package|parcel) (?:was |has been |is )?seized"
